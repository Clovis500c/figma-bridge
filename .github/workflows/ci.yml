name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Node 20 is the oldest supported runtime: the schema test runs dist/server.js with it.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: bun install
      - run: bun run build
      - run: bun run check
      - run: bun test
