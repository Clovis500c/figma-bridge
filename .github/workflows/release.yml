name: Release

# Publishes the version written in package.json to npm and creates the GitHub release.
# Start it with Actions → Release → Run workflow (on main), or by pushing a tag vX.Y.Z,
# or by publishing a release vX.Y.Z on github.com.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release and its tag
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Version to release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          tag="v$(node -p "require('./package.json').version")"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is missing: add it in Settings → Secrets and variables → Actions."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run this workflow on main."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($tag)."; exit 1
          fi
          if npm view "$name@${tag#v}" version > /dev/null 2>&1; then
            echo "::error::$name ${tag#v} is already on npm: change \"version\" in package.json first."; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - run: bun install
      - run: bun run build
      - run: bun run check
      - run: bun test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The zip is the source plus the built server and plugin, for the Bun install method.
      - name: Zip
        run: |
          mkdir -p stage
          git archive HEAD --prefix=figma-bridge/ | tar -x -C stage
          rm -rf stage/figma-bridge/.github
          cp -r dist stage/figma-bridge/
          cp plugin/code.js stage/figma-bridge/plugin/
          (cd stage && zip -qr "../figma-bridge-$TAG.zip" figma-bridge)

      # A release published on github.com already exists: attach the zip to it.
      - name: GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "figma-bridge-$TAG.zip" --clobber
          else
            gh release create "$TAG" "figma-bridge-$TAG.zip" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
